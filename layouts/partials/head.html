<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — ChunkScope{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='10' height='10' fill='%233e8e4f'/%3E%3Crect x='18' y='4' width='10' height='10' fill='%23d97706'/%3E%3Crect x='4' y='18' width='10' height='10' fill='%238b5a2b'/%3E%3Crect x='18' y='18' width='10' height='10' fill='%23cbd5e1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/css/main.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-{{ site.Params.adsensePublisher }}" crossorigin="anonymous"></script>
{{ if .IsHome }}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebSite","name":"ChunkScope","url":"{{ .Permalink }}","potentialAction":{"@type":"SearchAction","target":"{{ .Permalink }}?q={search_term_string}","query-input":"required name=search_term_string"}}
</script>
{{ end }}
{{ if eq .Type "tool" }}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"SoftwareApplication","name":"{{ .Title }}","applicationCategory":"UtilityApplication","operatingSystem":"Web","url":"{{ .Permalink }}","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}
</script>
{{ end }}
</head>
